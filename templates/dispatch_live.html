<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>대구 응급 중앙관제 · 실시간</title>
  <link rel="stylesheet" href="/static/leaflet/leaflet.css" />
  <script src="/static/leaflet/leaflet.js"></script>
  <style>
    :root {
      --ink: #1a2332; --muted: #5c6b7a; --panel: #f7f4ef; --line: #d5cfc4;
      --accent: #c45c26; --fire: #c45c26; --amb: #2f6f8f; --ok: #2d6a4f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; color: var(--ink); background: #e8e2d8; }
    .app { display: grid; grid-template-columns: 360px 1fr; height: 100%; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      aside { max-height: 48vh; overflow: auto; }
    }
    aside {
      background: var(--panel); border-right: 1px solid var(--line);
      padding: 1rem 1.1rem 1.2rem; display: flex; flex-direction: column; gap: 0.75rem;
    }
    .brand { font-family: Georgia, "Times New Roman", serif; font-size: 1.28rem; margin: 0; letter-spacing: -0.02em; }
    .sub { margin: 0; color: var(--muted); font-size: 0.8rem; line-height: 1.4; }
    label { display: block; font-size: 0.72rem; color: var(--muted); margin-bottom: 0.2rem; }
    select, button, input[type="range"] {
      width: 100%; font: inherit; border-radius: 6px; border: 1px solid var(--line);
      padding: 0.5rem 0.6rem; background: #fff;
    }
    button { cursor: pointer; background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }
    button.ghost { background: transparent; color: var(--ink); }
    button.play { background: var(--ok); border-color: var(--ok); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.4rem; }
    .clock-box {
      background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 0.55rem 0.65rem;
    }
    .clock {
      font-family: Georgia, serif; font-size: 1.6rem; letter-spacing: 0.04em; margin: 0;
    }
    .clock small { font-size: 0.75rem; color: var(--muted); margin-left: 0.4rem; }
    .hint {
      font-size: 0.78rem; background: #fff; border: 1px dashed var(--line);
      padding: 0.55rem 0.65rem; border-radius: 6px; color: var(--muted);
    }
    .hint strong { color: var(--accent); }
    #map { width: 100%; height: 100%; min-height: 360px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.35rem; font-size: 0.72rem; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 0.4rem; text-align: center; }
    .stat b { display: block; font-size: 1rem; }
    .list { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 0.4rem; min-height: 80px; }
    .item { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 0.5rem 0.6rem; font-size: 0.78rem; }
    .item .top { display: flex; justify-content: space-between; align-items: center; gap: 0.35rem; }
    .tag { font-size: 0.66rem; padding: 0.1rem 0.35rem; border-radius: 999px; background: #efe6dc; color: var(--fire); font-weight: 600; }
    .tag.amb { background: #e2eef3; color: var(--amb); }
    .tag.mix { background: #ece8f2; color: #5a4a7a; }
    .item button.x { width: auto; padding: 0.12rem 0.4rem; font-size: 0.7rem; background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .missions { font-size: 0.72rem; color: var(--muted); margin-top: 0.2rem; }
    .status { font-size: 0.74rem; color: var(--ok); min-height: 1.1em; }
    .status.err { color: #9b2226; }
    .legend-c { font-size: 0.7rem; color: var(--muted); line-height: 1.55; }
    .sw { display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: 3px; vertical-align: middle; }
    .log {
      font-size: 0.68rem; color: var(--muted); max-height: 72px; overflow: auto;
      background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 0.4rem 0.5rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div>
        <h1 class="brand">대구 응급 중앙관제</h1>
        <p class="sub">날짜·연휴·시간대 혼잡 예측 → 최적 출동경로 (표현용, 이후 학습모델 교체)</p>
      </div>

      <div class="clock-box">
        <label>지금 (로컬 시각 · 고정)</label>
        <p class="clock" id="clock"><span id="clock-text">--:--:--</span></p>
        <div id="now-date" style="font-size:0.82rem;margin:0.15rem 0 0.35rem;font-weight:600"></div>
        <div id="cal-badge" style="font-size:0.78rem;margin-bottom:0.4rem;color:var(--muted)"></div>
        <div id="clock-src" style="font-size:0.68rem;color:var(--muted);margin-bottom:0.45rem;word-break:break-all"></div>
        <div class="row" style="margin-top:0.45rem">
          <button type="button" class="play" id="btn-play">▶ 출동 추적</button>
          <button type="button" class="ghost" id="btn-pause">일시정지</button>
        </div>
        <div style="margin-top:0.4rem">
          <label for="speed">차량 표시 배속 <span id="speed-label">1x</span>
            <span style="color:var(--muted);font-weight:400"> (시계는 항상 지금 · 미래로 안 감)</span>
          </label>
          <input type="range" id="speed" min="1" max="20" step="1" value="1" />
        </div>
        <div id="cong-bar" style="margin-top:0.45rem;font-size:0.72rem;color:var(--muted)"></div>
        <div id="forecast-box" style="margin-top:0.5rem">
          <div style="font-size:0.72rem;color:var(--muted);margin-bottom:0.25rem">
            향후 6시간 혼잡 예측 <em style="font-style:normal;opacity:.85">(경로 비용용 · 차가 미래로 가지는 않음)</em>
          </div>
          <div id="forecast-bars" style="display:flex;align-items:flex-end;gap:3px;height:52px"></div>
          <div id="forecast-note" style="font-size:0.7rem;color:var(--muted);margin-top:0.25rem"></div>
        </div>
        <div style="margin-top:0.45rem;font-size:0.7rem;color:var(--muted)">
          교통량
          <span style="display:inline-block;width:72px;height:8px;vertical-align:middle;margin:0 4px;border-radius:2px;
            background:linear-gradient(90deg,#2166ac,#67a9cf,#fddbc7,#ef8a62,#b2182b)"></span>
          한산→혼잡
        </div>
      </div>

      <div>
        <label for="itype">다음에 찍을 사고 유형</label>
        <select id="itype"></select>
      </div>

      <div class="hint">
        <strong>목표</strong>: <em>지금</em> 기준으로 “앞으로 막힐 길”을 예측해 <em>지금 출발</em> 경로를 잡음<br />
        차량 마커는 GPS처럼 실제 이동을 표시 (시계는 미래로 가지 않음).
      </div>

      <div class="row">
        <button type="button" id="btn-clear" class="ghost">전체 삭제</button>
        <button type="button" id="btn-demo">데모 3건</button>
      </div>

      <div class="stats">
        <div class="stat"><b id="s-inc">0</b>사고</div>
        <div class="stat"><b id="s-unit">0</b>출동</div>
        <div class="stat"><b id="s-ov">0</b>겹침</div>
        <div class="stat"><b id="s-incident-road">—</b>돌발</div>
      </div>
      <div class="stats" style="margin-top:0.35rem">
        <div class="stat"><b id="s-amb">—</b>구급잔여</div>
        <div class="stat"><b id="s-fire">—</b>소방잔여</div>
      </div>
      <div id="fleet-box" class="hint" style="max-height:110px;overflow:auto;font-size:0.68rem;margin-top:0.35rem"></div>

      <div class="status" id="status">준비됨 — 사고 찍고 출동 추적</div>
      <div class="list" id="list"></div>
      <div class="log" id="log"></div>
      <div class="legend-c" id="legend"></div>
    </aside>
    <div id="map"></div>
  </div>

  <script>
    const COLORS = ["#00e5ff", "#ff2d6a", "#b8f200", "#ff9f1c", "#7b61ff", "#00f5d4", "#f15bb5", "#fee440"];


    let meta = null, map = null;
    let costLayer, facilityLayer, routeLayer, incidentLayer, vehicleLayer;
    let incidents = [];
    let localSeq = 1;
    let dispatchTimer = null;
    let playing = false;
    let raf = null;
    let playTimer = null;
    let lastTs = 0;
    let tMin = 480;
    let costmapTimer = null;
    let rerouteTimer = null;
    let totalReroutes = 0;
    let lastCostmapT = -999;
    let lastRerouteSimMin = -999;
    let syncingClock = false;
    let suppressDispatchFromClock = false;
    let lastWallRerouteMs = 0;
    let lastWallCostmapMs = 0;
    let lastWallForecastMs = 0;

    let simDate = null; // YYYY-MM-DD — 항상 오늘

    function localNowParts() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      const tMinNow = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
      return {
        date: `${yyyy}-${mm}-${dd}`,
        tMin: tMinNow,
        label: `${yyyy}-${mm}-${dd} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`,
      };
    }

    function syncWallClock(refreshMaps = false) {
      const n = localNowParts();
      simDate = n.date;
      tMin = n.tMin; // 시계는 항상 실제 지금
      const dateLabel = document.getElementById("now-date");
      if (dateLabel) dateLabel.textContent = n.label;
      const el = document.getElementById("clock-text");
      if (el) el.textContent = clockLabel(tMin, true);
      if (refreshMaps) {
        scheduleCostmap(true);
        refreshForecast();
      }
    }

    function getDateParam() {
      if (!simDate) simDate = localNowParts().date;
      return simDate;
    }

    function renderForecast(fc) {
      const box = document.getElementById("forecast-bars");
      const note = document.getElementById("forecast-note");
      if (!box || !fc || !fc.series) return;
      const maxC = Math.max(...fc.series.map(s => s.congestion), 0.01);
      box.innerHTML = fc.series.map(s => {
        const h = Math.max(4, Math.round(48 * s.congestion / maxC));
        return `<div title="${s.time_label} ${s.severity} (${s.congestion})"
          style="flex:1;height:${h}px;background:${s.color};border-radius:2px 2px 0 0"></div>`;
      }).join("");
      const peak = fc.peak || {};
      note.textContent = `지금 ${fc.now} · 추세 ${fc.trend} · 피크 ${peak.time_label || ""} (${peak.congestion || ""})`;
      if (fc.calendar) {
        document.getElementById("cal-badge").textContent =
          `${fc.calendar.date} · ${fc.calendar.weekday_name}요일 · ${fc.calendar.label} (교통배율 ×${fc.calendar.volume_factor})`;
      }
    }

    async function refreshForecast() {
      const q = new URLSearchParams({
        t_min: String(Math.floor(tMin)),
        hours: "6",
        date: getDateParam(),
      });
      const fc = await (await fetch(`/api/forecast?${q}`)).json();
      renderForecast(fc);
    }
    function tagClass(type) {
      if (type.startsWith("fire")) return "tag";
      if (type.startsWith("medical")) return "tag amb";
      return "tag mix";
    }
    function setStatus(msg, err=false) {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.className = "status" + (err ? " err" : "");
    }
    function logLine(msg) {
      const el = document.getElementById("log");
      const t = clockLabel(tMin);
      el.innerHTML = `[${t}] ${msg}<br>` + el.innerHTML;
    }
    function clockLabel(m, withSec = true) {
      m = ((m % 1440) + 1440) % 1440;
      const hh = String(Math.floor(m / 60)).padStart(2, "0");
      const mm = String(Math.floor(m % 60)).padStart(2, "0");
      if (!withSec) return `${hh}:${mm}`;
      const ss = String(Math.floor((m * 60) % 60)).padStart(2, "0");
      return `${hh}:${mm}:${ss}`;
    }
    function syncClockUI() {
      syncWallClock(false);
    }

    async function init() {
      if (typeof L === "undefined") {
        setStatus("지도 라이브러리(Leaflet) 로드 실패 — /static/leaflet 확인", true);
        return;
      }
      meta = await (await fetch("/api/meta")).json();
      document.getElementById("clock-src").textContent = meta.congestion_source || "";
      syncWallClock(false);
      if (meta.calendar) {
        document.getElementById("cal-badge").textContent =
          `${meta.calendar.date} · ${meta.calendar.weekday_name}요일 · ${meta.calendar.label}`;
      }

      // 벽시계 1초 갱신 (출동 중이어도 시계는 지금)
      setInterval(() => syncWallClock(false), 1000);
      // 1분마다 혼잡·예측만 갱신
      setInterval(() => {
        syncWallClock(true);
      }, 60000);

      const sel = document.getElementById("itype");
      for (const [k, v] of Object.entries(meta.presets || {})) {
        const opt = document.createElement("option");
        opt.value = k; opt.textContent = `${k} - ${(v && v.label) || k}`;
        if (k === "medical_1") opt.selected = true;
        sel.appendChild(opt);
      }

      const legend = document.getElementById("legend");
      legend.innerHTML = `지도 색 = 교통량 <span class="sw" style="background:#2166ac"></span>한산
        <span class="sw" style="background:#ef8a62"></span>혼잡
        <span class="sw" style="background:#b2182b"></span>정체<br>
        <b style="color:#e85d04">주황 공사</b> · <b style="color:#9b2226">빨강 돌발</b><br>
        남색□ 소방서 · 남색점 119센터 · <span style="color:#2a9d8f">초록점 아파트 진출입로</span><br>
        I마커=현장(단지 근처면 입구 스냅) · 형광선=출동경로`;

      renderFleet(meta.fleet);

      const b = meta.bounds;
      const daeguBounds = L.latLngBounds(
        [b.lat_min, b.lng_min],
        [b.lat_max, b.lng_max]
      );

      map = L.map("map", {
        maxBounds: daeguBounds.pad(0.08),
        maxBoundsViscosity: 0.8,
        minZoom: 10,
        maxZoom: 17,
      });
      map.fitBounds(daeguBounds, { padding: [8, 8] });

      // 배경 타일: OSM (실패해도 costmap·시설은 보임)
      const tiles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap",
        maxZoom: 19,
        errorTileUrl: "",
      });
      tiles.on("tileerror", () => {
        document.getElementById("map").style.background = "#c5d0c8";
      });
      tiles.addTo(map);
      document.getElementById("map").style.background = "#dfe6e0";

      // 대구 밖 마스크는 옅게 (구멍 감기 오류로 전체가 가려지던 문제 방지)
      try {
        const worldRing = [[-90, -180], [-90, 180], [90, 180], [90, -180]];
        const daeguHole = [
          [b.lat_min, b.lng_min],
          [b.lat_max, b.lng_min],
          [b.lat_max, b.lng_max],
          [b.lat_min, b.lng_max],
        ];
        L.polygon([worldRing, daeguHole], {
          stroke: false,
          fillColor: "#e8e2d8",
          fillOpacity: 0.55,
          interactive: false,
        }).addTo(map);
      } catch (_) {}
      L.rectangle(daeguBounds, {
        color: "#1a2332", weight: 1.5, opacity: 0.45,
        fill: false, interactive: false,
      }).addTo(map);

      // 경로가 costmap 아래에 깔리지 않도록 전용 pane
      map.createPane("costPane");
      map.getPane("costPane").style.zIndex = 350;
      map.createPane("routePane");
      map.getPane("routePane").style.zIndex = 450;
      map.createPane("vehiclePane");
      map.getPane("vehiclePane").style.zIndex = 550;

      costLayer = L.layerGroup({ pane: "costPane" }).addTo(map);
      facilityLayer = L.layerGroup().addTo(map);
      routeLayer = L.layerGroup({ pane: "routePane" }).addTo(map);
      incidentLayer = L.layerGroup().addTo(map);
      vehicleLayer = L.layerGroup({ pane: "vehiclePane" }).addTo(map);

      for (const s of meta.stations) {
        L.marker([s.lat, s.lng], {
          icon: L.divIcon({
            className: "",
            html: `<div style="width:11px;height:11px;background:#1a2332;border:2px solid #fff"></div>`,
            iconSize: [11,11], iconAnchor: [5,5],
          }),
        }).bindTooltip(`${s.name} (실제)`).addTo(facilityLayer);
        if (s.snap_lat != null && s.snap_lng != null) {
          L.circleMarker([s.snap_lat, s.snap_lng], {
            radius: 3, color: "#1a2332", weight: 1, fillColor: "#4a90d9", fillOpacity: 0.9,
          }).bindTooltip(`${s.name} 스냅노드`).addTo(facilityLayer);
          L.polyline([[s.lat, s.lng], [s.snap_lat, s.snap_lng]], {
            color: "#1a2332", weight: 1, dashArray: "2 3", opacity: 0.45,
          }).addTo(facilityLayer);
        }
      }
      for (const h of meta.hospitals) {
        L.marker([h.lat, h.lng], {
          icon: L.divIcon({
            className: "",
            html: `<div style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid #9b2226"></div>`,
            iconSize: [12,11], iconAnchor: [6,11],
          }),
        }).bindTooltip(`${h.name} (실제)`).addTo(facilityLayer);
        if (h.snap_lat != null && h.snap_lng != null) {
          L.circleMarker([h.snap_lat, h.snap_lng], {
            radius: 3, color: "#9b2226", weight: 1, fillColor: "#f4a261", fillOpacity: 0.9,
          }).bindTooltip(`${h.name} 스냅노드`).addTo(facilityLayer);
        }
      }
      // 119안전센터
      (meta.safety_centers || []).forEach(c => {
        L.circleMarker([c.lat, c.lng], {
          radius: 4, color: "#fff", weight: 1, fillColor: "#1d3557", fillOpacity: 0.85,
        }).bindTooltip(`${c.name}`).addTo(facilityLayer);
      });
      // 아파트 긴급차 진출입로
      (meta.emergency_entrances || []).forEach(e => {
        L.circleMarker([e.lat, e.lng], {
          radius: 3, color: "#fff", weight: 0.5, fillColor: "#2a9d8f", fillOpacity: 0.75,
        }).bindTooltip(`${e.name || "단지"} 입구${e.gate ? " "+e.gate : ""}`).addTo(facilityLayer);
      });
      if ((meta.safety_centers || []).length || (meta.emergency_entrances || []).length) {
        logLine(`안전센터 ${(meta.safety_centers||[]).length} · 진출입로 ${(meta.emergency_entrances||[]).length}`);
      }

      map.on("click", (e) => {
        if (!daeguBounds.contains(e.latlng)) {
          setStatus("대구 영역 안에서만 사고를 찍을 수 있습니다", true);
          return;
        }
        incidents.push({ type: document.getElementById("itype").value, lat: e.latlng.lat, lng: e.latlng.lng, localId: localSeq++ });
        scheduleDispatch(true);
      });

      document.getElementById("time") && (document.getElementById("time").oninput = null);
      const speedEl = document.getElementById("speed");
      const syncSpeedLabel = () => {
        document.getElementById("speed-label").textContent = `${speedEl.value}x`;
      };
      speedEl.oninput = syncSpeedLabel;
      syncSpeedLabel();
      document.getElementById("btn-play").onclick = () => startPlay(true);
      document.getElementById("btn-pause").onclick = () => stopPlay(true);
      document.getElementById("btn-clear").onclick = () => {
        incidents = []; fleet = [];
        routeLayer.clearLayers(); vehicleLayer.clearLayers(); incidentLayer.clearLayers();
        document.getElementById("list").innerHTML = "";
        document.getElementById("s-inc").textContent = "0";
        document.getElementById("s-unit").textContent = "0";
        setStatus("사고 없음");
      };
      document.getElementById("btn-demo").onclick = () => {
        incidents = [
          { type: "fire_1", lat: 35.87, lng: 128.60, localId: localSeq++ },
          { type: "medical_1", lat: 35.85, lng: 128.55, localId: localSeq++ },
          { type: "mixed_2", lat: 35.90, lng: 128.62, localId: localSeq++ },
        ];
        scheduleDispatch(true);
      };

      await refreshCostmap(true);
      await refreshForecast();
      await refreshRoadIncidents();
      setStatus("준비됨 — 날짜·시간 고르고 사고 찍기");
    }

    async function refreshRoadIncidents() {
      try {
        const data = await (await fetch("/api/road-incidents")).json();
        if (!data.ok) {
          setStatus(`돌발 API: ${data.error || "실패"}`, true);
          return;
        }
        if (!facilityLayer) return;
        let nConst = 0, nOther = 0;
        (data.incidents || []).forEach(ev => {
          const isConst = String(ev.code) === "2" || /공사/.test(ev.title || "");
          if (isConst) nConst += 1; else nOther += 1;
          const fill = isConst ? "#e85d04" : "#9b2226";
          const label = isConst ? "공사" : "돌발";
          L.marker([ev.lat, ev.lng], {
            icon: L.divIcon({
              className: "",
              html: `<div style="font:800 11px sans-serif;background:${fill};color:#fff;padding:2px 6px;border-radius:4px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);white-space:nowrap">${label}</div>`,
              iconSize: [40, 18], iconAnchor: [20, 9],
            }),
            zIndexOffset: 800,
          }).bindPopup(
            `<b>${label}</b> (code=${ev.code || "?"})<br>${(ev.title || "").slice(0, 160)}<br>` +
            `${ev.location || ""}<br>${ev.start || ""} ~ ${ev.end || ""}`
          ).addTo(facilityLayer);
        });
        const badge = document.getElementById("s-incident-road");
        if (badge) badge.textContent = String((data.n || 0));
        if ((data.n || 0) > 0) {
          logLine(`돌발 ${data.n}건 (공사 ${nConst} · 기타 ${nOther})`);
          setStatus(`준비됨 · 돌발 ${data.n}건 표시 (공사 ${nConst})`);
        } else {
          logLine("돌발 0건 (현재 진행 중 공사/사고 없음)");
        }
      } catch (e) {
        console.warn("road-incidents", e);
        setStatus(`돌발 로드 실패: ${e.message || e}`, true);
      }
    }

    function scheduleCostmap() {
      clearTimeout(costmapTimer);
      costmapTimer = setTimeout(() => refreshCostmap(false), 120);
    }

    async function refreshCostmap(force) {
      if (!costLayer) return;
      const bucket = Math.floor(tMin / 5) * 5;
      if (!force && bucket === lastCostmapT) return;
      lastCostmapT = bucket;
      try {
        const data = await (await fetch(`/api/costmap?t_min=${bucket}&date=${encodeURIComponent(getDateParam())}`)).json();
        costLayer.clearLayers();
        const segs = data.segments || [];
        for (const seg of segs) {
          L.polyline(seg.coords, {
            color: seg.color || "#888",
            weight: 4.5 + (seg.level || 0) * 1.4,
            opacity: 0.88,
            lineCap: "round",
            lineJoin: "round",
            pane: "costPane",
            interactive: false,
          }).addTo(costLayer);
        }
        const h = data.histogram || [0,0,0,0];
        const tot = Math.max(1, h.reduce((a,b)=>a+b,0));
        const avg = data.city_avg != null ? ` · 평균 ${data.city_avg}` : "";
        const bar = document.getElementById("cong-bar");
        if (bar) {
          bar.innerHTML =
            `${data.time_label || ""} 교통량 도로 ${segs.length}개${avg}<br>` +
            `한산 ${Math.round(100*h[0]/tot)}% · 서행 ${Math.round(100*h[1]/tot)}% · ` +
            `혼잡 ${Math.round(100*h[2]/tot)}% · 정체 ${Math.round(100*h[3]/tot)}%`;
        }
        if (data.calendar) {
          const badge = document.getElementById("cal-badge");
          if (badge) {
            badge.textContent =
              `${data.calendar.date} · ${data.calendar.weekday_name}요일 · ${data.calendar.label} (×${data.calendar.volume_factor})`;
          }
        }
      } catch (err) {
        console.error("costmap", err);
        setStatus(`교통량 지도 로드 실패: ${err.message || err}`, true);
      }
    }

    function scheduleDispatch(resetFleet) {
      renderIncidentDraft();
      setStatus("배차·경로 계산 중…");
      clearTimeout(dispatchTimer);
      dispatchTimer = setTimeout(() => runDispatch(resetFleet), 160);
    }

    function renderIncidentDraft() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      incidentLayer.clearLayers();
      incidents.forEach((inc, idx) => {
        L.circleMarker([inc.lat, inc.lng], { radius: 7, color: "#111", weight: 2, fillColor: "#fff", fillOpacity: 0.9 })
          .addTo(incidentLayer);
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<div class="top"><span><span class="${tagClass(inc.type)}">${inc.type}</span> #${idx+1}</span>
          <button type="button" class="x" data-id="${inc.localId}">삭제</button></div>`;
        list.appendChild(div);
      });
      list.querySelectorAll("button.x").forEach(btn => {
        btn.onclick = () => {
          incidents = incidents.filter(x => x.localId !== Number(btn.dataset.id));
          scheduleDispatch(true);
        };
      });
      document.getElementById("s-inc").textContent = String(incidents.length);
    }

    async function runDispatch(resetFleet) {
      if (!incidents.length) {
        fleet = [];
        routeLayer.clearLayers(); vehicleLayer.clearLayers();
        document.getElementById("s-unit").textContent = "0";
        setStatus("사고 없음");
        return;
      }
      try {
        const res = await fetch("/api/dispatch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            t_min: tMin,
            date: getDateParam(),
            horizon_min: 45,
            incidents: incidents.map(i => ({ type: i.type, lat: i.lat, lng: i.lng })),
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "dispatch failed");
        if (!data.missions || !data.missions.length) {
          throw new Error("배차 결과 없음 (경로 0건)");
        }
        if (data.forecast) renderForecast({ ...data.forecast, series: data.forecast.series, calendar: data.calendar, now: data.forecast.now, trend: data.forecast.trend, peak: data.forecast.peak });
        else refreshForecast();
        drawIncidents(data);
        buildFleet(data.missions, data.incidents || []);
        drawRoutesAndVehicles();
        fitToMissions(data.missions);
        await refreshCostmap(true);
        await refreshForecast();
        document.getElementById("s-unit").textContent = String(data.summary.n_units);
        document.getElementById("s-ov").textContent = String(data.summary.overlap);
        if (data.fleet) renderFleet(data.fleet);
        const totalEta = data.summary.total_eta_min != null ? data.summary.total_eta_min
          : data.missions.reduce((s, m) => s + (m.eta_min || 0), 0);
        const ambLeft = data.summary.amb_available != null ? ` · 구급잔여 ${data.summary.amb_available}` : "";
        const rs = data.route_source || data.summary.route_source || "";
        setStatus(`${data.time_label} 배차 ${data.missions.length}대 · ETA ${totalEta}분${ambLeft}` + (rs ? ` · 경로=${rs}` : ""));
        fillList(data);
        logLine(`출동 경로 ${data.missions.length}건 (${rs || "graph"})`);
        startPlay(true);
      } catch (err) {
        console.error(err);
        setStatus(String(err.message || err), true);
        logLine(`오류: ${err.message || err}`);
      }
    }

    function fitToMissions(missions) {
      const pts = [];
      missions.forEach(m => (m.path || []).forEach(p => pts.push(p)));
      if (pts.length >= 2) {
        try {
          const b = meta.bounds;
          const clipped = L.latLngBounds(
            [b.lat_min, b.lng_min], [b.lat_max, b.lng_max]
          );
          map.fitBounds(pts, { padding: [40, 40], maxZoom: 14 });
          // 대구 밖으로 나가지 않게
          if (!clipped.contains(map.getBounds().getCenter())) {
            map.fitBounds(clipped, { padding: [8, 8] });
          }
        } catch (_) {}
      }
    }

    function drawIncidents(data) {
      incidentLayer.clearLayers();
      data.incidents.forEach(inc => {
        // 현장 = 사용자가 클릭한 좌표만 (스냅/병원 좌표로 절대 바꾸지 않음)
        const mainLat = (inc.click_lat != null) ? inc.click_lat : inc.lat;
        const mainLng = (inc.click_lng != null) ? inc.click_lng : inc.lng;
        L.circleMarker([mainLat, mainLng], {
          radius: 10, color: "#111", weight: 3, fillColor: "#ffe566", fillOpacity: 1,
        }).bindPopup(
          `<b>I${inc.incident_id} 현장(클릭)</b><br>${inc.type} · ${inc.label}<br>` +
          `${mainLat.toFixed(5)}, ${mainLng.toFixed(5)}`
        ).addTo(incidentLayer);
        L.marker([mainLat, mainLng], {
          icon: L.divIcon({
            className: "",
            html: `<div style="font:700 12px sans-serif;background:#c1121f;color:#fff;padding:2px 6px;border-radius:3px">I${inc.incident_id}</div>`,
            iconSize: [30,18], iconAnchor: [-4, 20],
          }),
        }).addTo(incidentLayer);
      });
    }

    function fillList(data) {
      const list = document.getElementById("list");
      list.innerHTML = "";
      data.incidents.forEach((inc, idx) => {
        const related = data.missions.filter(m => m.incident_id === inc.incident_id);
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<div class="top"><span><span class="${tagClass(inc.type)}">${inc.type}</span> I${inc.incident_id}</span>
          <button type="button" class="x" data-idx="${idx}">삭제</button></div>
          <div class="missions">${related.map(m => {
            const eta = (m.eta_min != null) ? m.eta_min
              : ((m.edge_times || []).reduce((a, b) => a + Number(b || 0), 0) || null);
            const etaTxt = (eta != null && !Number.isNaN(Number(eta))) ? Number(eta).toFixed(1) : "-";
            return `${m.label}: ${m.station_name || "소방서"} → 현장 → ${m.hospital_name || "종료"} (ETA ${etaTxt}분)`;
          }).join("<br>")}</div>`;
        list.appendChild(div);
      });
      list.querySelectorAll("button.x").forEach(btn => {
        btn.onclick = () => { incidents.splice(Number(btn.dataset.idx), 1); scheduleDispatch(true); };
      });
    }

    function segmentsFromNodes(latlngs) {
      if (!latlngs || latlngs.length < 2) return [];
      const segs = [];
      for (let i = 0; i < latlngs.length - 1; i++) segs.push([latlngs[i], latlngs[i + 1]]);
      return segs;
    }

    function buildFleet(missions, incidentList) {
      vehicleLayer.clearLayers();
      fleet = [];
      missions.forEach((m, i) => {
        const nodeLL = (m.path_node_latlng && m.path_node_latlng.length)
          ? m.path_node_latlng
          : (m.path || []);
        let segs = m.edge_segments || [];
        const times = (m.edge_times && m.edge_times.length) ? m.edge_times.slice()
          : nodeLL.slice(0, -1).map(() => 0.5);
        // 구간 수 ≠ 시간 수 이면 노드 직선으로 재구성 (조기 완료 버그 방지)
        if (segs.length !== times.length) {
          segs = segmentsFromNodes(nodeLL);
        }
        const path = m.path && m.path.length >= 2 ? m.path : nodeLL;
        if (path.length < 2 || times.length < 1) {
          console.warn("path too short", m.label, path);
          return;
        }
        const color = COLORS[i % COLORS.length];
        const marker = L.circleMarker(path[0], {
          radius: 9, color: "#fff", weight: 2, fillColor: color, fillOpacity: 1,
          pane: "vehiclePane",
        }).bindTooltip(m.label).addTo(vehicleLayer);
        const wp = m.waypoints || {};
        // 현장 = 같은 응답의 클릭 좌표 (I마커와 100% 동일). 노드/병원 좌표 금지.
        const incMeta = (incidentList || []).find(x => x.incident_id === m.incident_id);
        const sll = (incMeta && incMeta.click_lat != null)
          ? [incMeta.click_lat, incMeta.click_lng]
          : (m.scene_xy || null);
        // 중복 점 안 찍음: I마커가 이미 현장. 툴팁만 로그용으로 scene_xy 보관.
        fleet.push({
          id: m.id || m.label,
          label: m.label,
          vehicle_type: m.vehicle_type,
          station_id: m.station_id,
          incident_id: m.incident_id,
          color,
          path,
          path_nodes: m.path_nodes || [],
          path_node_latlng: nodeLL,
          edge_segments: segs,
          edge_times: times,
          edge_speeds: (m.edge_speeds && m.edge_speeds.length) ? m.edge_speeds.slice() : [],
          edgeIdx: 0,
          frac: 0,
          done: false,
          reachedScene: false,
          marker,
          scene_node: wp.scene_node,
          hospital_node: wp.hospital_node,
          goal_node: m.goal_node,
          scene_xy: sll,
          hospital_xy: m.hospital_xy || null,
          station_xy: m.station_xy || null,
          route_source: m.route_source || "",
          dispatch_len: (m.dispatch_len != null) ? Number(m.dispatch_len) : times.length,
          phase: "to_scene",
          polyline: null,
          casing: null,
          needsReroute: false,
        });
      });
    }

    function renderFleet(fleet) {
      if (!fleet || !fleet.totals) return;
      const ta = fleet.totals.ambulances || {};
      const tf = fleet.totals.fire_trucks || {};
      const ambEl = document.getElementById("s-amb");
      const fireEl = document.getElementById("s-fire");
      if (ambEl) ambEl.textContent = `${ta.available ?? "—"}/${ta.capacity ?? "—"}`;
      if (fireEl) fireEl.textContent = `${tf.available ?? "—"}/${tf.capacity ?? "—"}`;
      const box = document.getElementById("fleet-box");
      if (!box) return;
      const rows = (fleet.stations || []).map(s => {
        const a = s.ambulances || {};
        const f = s.fire_trucks || {};
        const short = (s.station_name || "").replace("대구", "").replace("소방서", "");
        return `${short} 구급 ${a.available}/${a.capacity} · 소방 ${f.available}/${f.capacity}`;
      });
      box.innerHTML = `<strong>소방서 잔여</strong><br>${rows.join("<br>")}`;
    }

    async function releaseFleetUnits(units) {
      if (!units || !units.length) return;
      try {
        const res = await fetch("/api/fleet/release", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ units }),
        });
        const data = await res.json();
        if (data.fleet) renderFleet(data.fleet);
      } catch (e) {
        console.warn(e);
      }
    }

    function drawRoutesAndVehicles() {
      routeLayer.clearLayers();
      const boundsPts = [];
      fleet.forEach(v => {
        if (!v.path || v.path.length < 2) return;
        v.path.forEach(p => boundsPts.push(p));
        // 흰 테두리 + 형광 본선 → costmap 위에서도 무조건 보이게
        v.casing = L.polyline(v.path, {
          color: "#ffffff", weight: 10, opacity: 0.95, lineJoin: "round", pane: "routePane",
        }).addTo(routeLayer);
        v.polyline = L.polyline(v.path, {
          color: v.color, weight: 6, opacity: 1, lineJoin: "round", pane: "routePane",
        }).bindPopup(
          `<b>${v.label}</b><br/>${v.vehicle_type}<br/>hops ${v.path.length - 1}`
        ).addTo(routeLayer);
        v.marker.setLatLng(posOnEdge(v));
        v.marker.bringToFront();
      });
      if (!fleet.length) {
        setStatus("경로를 그릴 차량이 없습니다", true);
      }
    }

    function posOnPolyline(coords, frac) {
      if (!coords || coords.length < 2) return coords && coords[0] ? coords[0] : [0, 0];
      const f = Math.max(0, Math.min(1, frac));
      if (f <= 0) return coords[0];
      if (f >= 1) return coords[coords.length - 1];
      const n = coords.length - 1;
      const t = f * n;
      const i = Math.min(Math.floor(t), n - 1);
      const u = t - i;
      const a = coords[i];
      const b = coords[i + 1];
      return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
    }

    function posOnEdge(v) {
      const segs = v.edge_segments;
      if (segs && segs.length && v.edgeIdx < segs.length && segs[v.edgeIdx] && segs[v.edgeIdx].length >= 2) {
        return posOnPolyline(segs[v.edgeIdx], v.frac);
      }
      if (!v.path || !v.path.length) return [0, 0];
      if (v.edgeIdx >= v.path.length - 1) return v.path[v.path.length - 1];
      const a = v.path[v.edgeIdx];
      const b = v.path[v.edgeIdx + 1];
      return [a[0] + (b[0] - a[0]) * v.frac, a[1] + (b[1] - a[1]) * v.frac];
    }

    function currentNode(v) {
      if (!v.path_nodes || !v.path_nodes.length) return null;
      return v.path_nodes[Math.min(v.edgeIdx, v.path_nodes.length - 1)];
    }

    function startPlay(force = false) {
      if (playing && !force) {
        setStatus(`이미 추적 중`);
        return;
      }
      if (!fleet.length) {
        if (incidents.length) {
          setStatus("배차 후 추적을 시작합니다…");
          scheduleDispatch(true);
          return;
        }
        setStatus("먼저 사고를 찍어주세요", true);
        return;
      }
      stopPlay(false);
      playing = true;
      syncWallClock(false);
      lastTs = performance.now();
      lastWallRerouteMs = performance.now();
      lastWallCostmapMs = performance.now();
      lastWallForecastMs = performance.now();
      setStatus(`▶ 출동 추적 중 (시계=지금)`);
      logLine("출동 추적 시작 (차량만 이동 · 시각은 실시간 지금)");
      raf = requestAnimationFrame(function loop(now) {
        if (!playing) return;
        try { tick(now); } catch (err) {
          console.error("tick error", err);
          setStatus(`추적 오류: ${err.message || err}`, true);
        }
        if (playing) raf = requestAnimationFrame(loop);
      });
    }

    function stopPlay(updateStatus = true) {
      playing = false;
      if (raf) cancelAnimationFrame(raf);
      raf = null;
      if (playTimer) clearInterval(playTimer);
      playTimer = null;
      syncWallClock(false);
      if (updateStatus) setStatus(`일시정지 · ${localNowParts().label}`);
    }

    function tick(now) {
      if (!playing) return;
      let dt = (now - lastTs) / 1000;
      if (!isFinite(dt) || dt < 0) dt = 0.05;
      dt = Math.min(Math.max(dt, 0.016), 0.2);
      lastTs = now;

      // 벽시계는 절대 미래로 밀지 않음
      syncWallClock(false);

      const speedEl = document.getElementById("speed");
      const displayX = Number(speedEl && speedEl.value ? speedEl.value : 1);
      // 차량 표시만 배속 (edge_times=분)
      const dMoveMin = (dt * displayX) / 60.0;

      let liveSpeed = null;
      let moving = 0;
      for (const v of fleet) {
        if (v.done || !v.path || v.path.length < 2) continue;
        moving += 1;
        let remain = dMoveMin;
        while (remain > 0 && v.edgeIdx < v.edge_times.length) {
          const et = Math.max(Number(v.edge_times[v.edgeIdx]) || 0.2, 0.05);
          if (v.edge_speeds && v.edge_speeds[v.edgeIdx] != null) {
            liveSpeed = v.edge_speeds[v.edgeIdx];
          }
          const left = (1 - v.frac) * et;
          if (remain >= left) {
            remain -= left;
            v.edgeIdx += 1;
            v.frac = 0;
            // 구간 끝점 스냅 (노드 배열 인덱스로 병원/교차점 끌어오지 않음)
            const prev = v.edge_segments && v.edge_segments[v.edgeIdx - 1];
            if (prev && prev.length) {
              if (v.marker) v.marker.setLatLng(prev[prev.length - 1]);
            }
          } else {
            v.frac += remain / et;
            remain = 0;
          }
        }
        if (v.vehicle_type === "ambulance" && v.phase === "to_scene") {
          const need = (v.dispatch_len != null) ? Number(v.dispatch_len) : -1;
          if (need >= 0 && v.edgeIdx >= need && !v.reachedScene) {
            v.reachedScene = true;
            v.phase = "to_hospital";
            v.goal_node = v.hospital_node;
            // 반드시 클릭 현장 좌표
            if (v.scene_xy && v.marker) v.marker.setLatLng(v.scene_xy);
            logLine(`${v.label} 현장 도착 → 응급실 이송`);
          }
        }
        if (v.edgeIdx >= v.edge_times.length) {
          if (!v.done) {
            if (v.vehicle_type === "ambulance" && !v.reachedScene) {
              v.reachedScene = true;
              v.phase = "to_hospital";
              if (v.scene_xy && v.marker) v.marker.setLatLng(v.scene_xy);
              logLine(`${v.label} 현장 경유 확인`);
            }
            v.done = true;
            v.frac = 0;
            const endLL = v.hospital_xy || (v.path && v.path.length ? v.path[v.path.length - 1] : null);
            if (endLL && v.marker) v.marker.setLatLng(endLL);
            logLine(`${v.label} 도착 완료 → 차량 복귀`);
            if (v.station_id != null) {
              releaseFleetUnits([{
                id: v.id,
                station_id: v.station_id,
                vehicle_type: v.vehicle_type,
              }]);
            }
          }
        }
        if (v.marker) v.marker.setLatLng(posOnEdge(v));
      }

      const spdTxt = liveSpeed != null ? ` · GPS ${liveSpeed} km/h` : "";
      setStatus(`▶ 지금 ${clockLabel(tMin)} · 차량표시 ${displayX}x · 이동 ${moving}/${fleet.length}${spdTxt}`);

      if (now - lastWallCostmapMs >= 30000) {
        lastWallCostmapMs = now;
        scheduleCostmap(true);
      }
      if (now - lastWallRerouteMs >= 120000) {
        lastWallRerouteMs = now;
        maybeReroute();
      }
      if (now - lastWallForecastMs >= 60000) {
        lastWallForecastMs = now;
        refreshForecast();
      }

      if (fleet.length && fleet.every(v => v.done)) {
        stopPlay(false);
        setStatus(`전 차량 도착 · ${localNowParts().label}`);
      }
    }

    async function maybeReroute() {
      const active = fleet.filter(v => !v.done);
      if (!active.length) return;
      const payload = {
        t_min: tMin,
        vehicles: active.map(v => {
          const cur = currentNode(v);
          const remaining = (v.path_nodes || []).slice(v.edgeIdx);
          const pos = posOnEdge(v);
          return {
            id: v.id,
            current_node: cur,
            current_lat: pos[0],
            current_lng: pos[1],
            goal_node: v.phase === "to_scene" ? v.scene_node : (v.goal_node || v.hospital_node),
            scene_node: v.scene_node,
            hospital_node: v.hospital_node,
            scene_xy: v.scene_xy,
            hospital_xy: v.hospital_xy,
            path_nodes: v.path_nodes,
            remaining_nodes: remaining,
            vehicle_type: v.vehicle_type,
            phase: v.phase,
          };
        }).filter(x => (x.current_lat != null || x.current_node) && (x.goal_node || x.scene_node || x.scene_xy)),
      };
      if (!payload.vehicles.length) return;
      try {
        const res = await fetch("/api/reroute", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ...payload,
            date: getDateParam(),
            horizon_min: 45,
          }),
        });
        const data = await res.json();
        let changed = 0;
        for (const upd of data.vehicles) {
          const v = fleet.find(x => x.id === upd.id);
          if (!v || !upd.path || upd.path.length < 2) continue;
          const rem = (v.path_nodes || []).slice(v.edgeIdx).map(Number);
          const neu = (upd.path_nodes || []).map(Number);
          const same = rem.length === neu.length && rem.every((n, i) => n === neu[i]);
          if (!same) {
            // 현재 위치에서 이어붙이기 — 진행률 유지하지 않고 새 남은 경로로 교체
            v.path = upd.path;
            v.path_nodes = upd.path_nodes;
            v.edge_segments = upd.edge_segments || [];
            v.edge_times = upd.edge_times;
            if (upd.edge_speeds) v.edge_speeds = upd.edge_speeds;
            if (v.vehicle_type === "ambulance" && v.phase === "to_scene" && v.scene_node != null) {
              const si = v.path_nodes.indexOf(v.scene_node);
              v.dispatch_len = si >= 0 ? si : v.dispatch_len;
            } else if (v.phase === "to_hospital") {
              v.dispatch_len = 0;
            }
            v.edgeIdx = 0;
            v.frac = 0;
            v.done = false;
            changed += 1;
            totalReroutes += 1;
            logLine(`재경로 ${v.label} · ETA ${upd.eta_min}분`);
          } else {
            // 같은 길이면 속도/시간만 갱신 (위치 리셋 금지)
            v.edge_times = upd.edge_times;
            if (upd.edge_speeds) v.edge_speeds = upd.edge_speeds;
          }
        }
        document.getElementById("s-rr").textContent = String(totalReroutes);
        if (changed) drawRoutesAndVehicles();
      } catch (e) {
        console.warn(e);
      }
    }

    init().catch(err => setStatus(String(err), true));
  </script>
</body>
